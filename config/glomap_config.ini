####################
# Pipeline control
####################
# Options: exhaustive, sequential
matcher_type=exhaustive

# if set to true, use colmap, otherwise use glomap
use_colmap_mapper=false


# Path settings
input_path=/workspace/images
output_path=/workspace/output
database_path=/workspace/output/database.db
#video_path=/workspace/video/02162025165431621.mov
#video_path=/workspace/video/IMG_3555.MOV
video_path=/workspace/video/REPLACEME


# Extract 1 frame per second, adjust as needed
frames_per_second=6


#######################################################
#
# Below are the various technical parameters for the various steps
#
#######################################################

# Global options
debug_level=1
num_threads=-1  # Use all CPU cores
num_workers=4   # Number of workers for GLOMAP processing

# Feature extraction options
camera_model=SIMPLE_RADIAL
single_camera=true
camera_params=""
default_focal_length_factor=1.2

# SiftExtraction options
gpu_index=0
max_image_size=3200
max_num_features=8192
first_octave=-1
num_octaves=4
octave_resolution=3
peak_threshold=0.02
edge_threshold=10
estimate_affine_shape=false
domain_size_pooling=false
upright=false

# Exhaustive matching options
SiftMatching.gpu_index=0
SiftMatching.guided_matching=true
SiftMatching.max_num_matches=32768
SiftMatching.max_error=4.0
SiftMatching.max_distance=0.7
SiftMatching.max_ratio=0.8
SiftMatching.cross_check=true
SiftMatching.min_num_matches=15

# Mapper options
min_num_matches=15
max_num_models=50
max_model_overlap=20
min_model_size=10
init_image_id1=0
init_image_id2=1
extract_colors=true
ba_min_num_residuals_for_multi_threading=50000
ba_local_max_num_iterations=25
ba_local_max_refinements=2
ba_local_function_tolerance=0
ba_global_use_gpu=true
ba_global_gpu_index=0

# Dense stereo options
PatchMatchStereo.max_image_size=2400
PatchMatchStereo.window_radius=5
PatchMatchStereo.window_step=1
PatchMatchStereo.num_samples=15
PatchMatchStereo.num_iterations=5
PatchMatchStereo.geom_consistency=true
PatchMatchStereo.filter=true
PatchMatchStereo.filter_min_ncc=0.1
PatchMatchStereo.depth_min=0.1
PatchMatchStereo.depth_max=100.0
PatchMatchStereo.sigma_spatial=5.0
PatchMatchStereo.sigma_color=3.0
PatchMatchStereo.gpu_index=0

# Meshing options
DelaunayMeshing.quality_regularization=1.0
DelaunayMeshing.max_proj_dist=10.0
DelaunayMeshing.max_depth_dist=2.0
DelaunayMeshing.distance_sigma_factor=1.0
DelaunayMeshing.num_threads=-1

# Texture mapping options
TextureMapping.resolution=4096
TextureMapping.min_resolution=128
TextureMapping.max_resolution=8192
TextureMapping.geometric_visibility_test=true
TextureMapping.keep_unseen_faces=true
TextureMapping.global_seam_leveling=true
TextureMapping.local_seam_leveling=true
TextureMapping.patch_packing_atlas_size=8192
TextureMapping.gpu_index=0

####################
# GLOMAP settings
####################
# Feature matching settings
GLOMAP.max_num_matches=1000
GLOMAP.matching_strategy=mutual
GLOMAP.matching_threshold=0.8
GLOMAP.ransac_iterations=1000
GLOMAP.ransac_threshold=4.0
GLOMAP.ransac_confidence=0.999

# Global SfM settings
GLOMAP.min_rotation_inliers=15
GLOMAP.min_translation_inliers=100
GLOMAP.rotation_filter_max_parallax=5.0
GLOMAP.graph_connection_num_checks=10
GLOMAP.triplet_overlap_ratio=0.3

# Bundle adjustment settings
GLOMAP.bundle_adjustment_robust_loss=cauchy
GLOMAP.bundle_adjustment_robust_threshold=1.0
GLOMAP.bundle_adjustment_refine_focal_length=true
GLOMAP.bundle_adjustment_refine_principal_point=false
GLOMAP.bundle_adjustment_refine_extra_params=true
GLOMAP.bundle_adjustment_max_iterations=100
GLOMAP.bundle_adjustment_function_tolerance=1e-6
GLOMAP.bundle_adjustment_gradient_tolerance=1e-10
GLOMAP.bundle_adjustment_parameter_tolerance=1e-8

# Point triangulation settings
GLOMAP.triangulation_method=angle
GLOMAP.triangulation_min_angle=1.5
GLOMAP.triangulation_max_error=4.0
GLOMAP.triangulation_min_views=2
GLOMAP.triangulation_max_outlier_ratio=0.5

# Point filtering settings
GLOMAP.filter_points=true
GLOMAP.filter_max_reproj_error=4.0
GLOMAP.filter_min_tri_angle=1.5
GLOMAP.filter_min_views=3
